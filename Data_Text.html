<html>
<body>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <div>
    <canvas id="chart1" style="max-height:200px"></canvas>
  </div>
  <input type="file" id="csvFile" accept=".csv" /><br/><br/>
  <button onclick="createChart1()">Chart 1</button>
  <script>
    const addToKey = (acc, key, value) => 
      Object.assign({}, acc, { [key]: (acc[key] || 0) + value });

    function bacaTeks(teks){
      const lines = teks.trim().split(/\r?\n/).filter(Boolean);
      const rows = lines.slice(1).map(line => line.split(",").map(cell => cell.trim()));
      return { rows };
    };

    // ni biar bisa auto pilih csvfile
    async function createChart1(){
      try {
        const file = document.getElementById("csvFile").files[0];
        const teks = await file.text();
        const games = bacaTeks(teks);

        // ni tingal ubah [?] nya
        const hasil = games.rows.reduce((acc, x) => {
        return addToKey(acc,
            x[33] == "E" ? "Everyone" :
            x[33] == "ET" ? "Everyone 10+" :
            x[33] == "T" ? "Teen" :
            x[33] == "M" ? "Mature" :
            "Unknown", 
            1
          );
        },
        { Everyone: 0, "Everyone 10+": 0, Teen: 0, Mature: 0, Unknown: 0 }
        );

        // ni chart bar biasa
        new Chart(document.getElementById('chart1'), {
          type: 'bar',
          data: {
            labels: Object.keys(hasil),
            datasets: [{
              label: '# of App Open Per Day',
              data: Object.values(hasil),
              borderWidth: 1
            }]
          }
        });
      } catch (error) {
        console.error(error.message);
      }
    };
  </script>
</body>
</html>
